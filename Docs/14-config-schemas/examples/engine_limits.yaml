total_level: 510              # 255 * 2
ability_growth_cap: 255       # 六维 uint8
ability_settled_cap: 65535    # 结算路径曾用 16 位立即数
skill_cap: 510                # 两段等级之和
town_develop: 65535           # uint16
cargo_stack: 255              # 件数 uint8；UI 宽度不是这条
gold: 2147483647
exp_per_track: 4294967295
