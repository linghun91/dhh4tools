schema: dk4.ids
version: 1
# 构建产物（加载器生成，不手写；运行时文件是 config/ids/generated.json）。本文件是对照片段。
# 原版包按 vanilla_index 固定 0..N-1；模组 key 接在后面紧凑分配。存档写同一张表（id_map）做重映射。
# 不含哨兵：空值是 null，不占整数。原版 98 / 106 只在 ids/legacy_codec.yaml。
# 所属：Docs/00-overview/05-config-architecture.md「ID 与命名空间」

town:
  vanilla:london: 0
  vanilla:bristol: 1
  mymod:new_port: 97          # 第 2 个模组港会拿到 98：与原版「无港」字节同值，所以运行时不得用 98 当空

person:
  vanilla:raphael_castro: 0

ability:
  vanilla:stamina: 0
  vanilla:agility: 1
  vanilla:charm: 2
  vanilla:intelligence: 3
  vanilla:spirit: 4
  vanilla:luck: 5

trading_item:
  vanilla:wheat: 0
  vanilla:coal: 99
  mymod:tea_brick: 105
