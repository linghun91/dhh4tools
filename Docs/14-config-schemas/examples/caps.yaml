# 只放「上限」；门槛 / 除数 / 基准是公式参数，在 formulas/ 写一次（公式里用 $caps.<key> 引用这里）。
# 所属：Docs/13-algorithms/02-caps-ranges.md；键名以 Docs/00-overview/10-key-glossary.md §7 为准。

