schema: dk4.world.map_point_kinds
version: 2
# 12 种地图点。所属：Docs/01-world/10-mappoint-kinds.md（旧路径 world/mappoint_kinds.yaml 是别名）。
# 本表只定 kind key；kind → 设施处理器（D9）只写在 town/facilities.yaml。每港有哪些点在 town/town_map_points.yaml（初值 +0x48）。
# 位域布局（STown+0x48 / CTown+0x14）只在 legacy 导入用。显示名走 name_key → ui/strings.*.yaml。
kinds:
  - { key: vanilla:plaza,    vanilla_index: 0,  name_key: ui.mappoint.plaza,    original_class: CPlazaView }
  - { key: vanilla:exchange, vanilla_index: 1,  name_key: ui.mappoint.exchange, original_class: CTrade }
  - { key: vanilla:shipyard, vanilla_index: 2,  name_key: ui.mappoint.shipyard, original_class: CShipyard }
  - { key: vanilla:dock,     vanilla_index: 3,  name_key: ui.mappoint.dock,     original_class: CPort }
  - { key: vanilla:bar,      vanilla_index: 4,  name_key: ui.mappoint.bar,      original_class: CBar }
  - { key: vanilla:guild,    vanilla_index: 5,  name_key: ui.mappoint.guild,    original_class: CGuild }
  - { key: vanilla:palace,   vanilla_index: 6,  name_key: ui.mappoint.palace,   original_class: CPalace }
  - { key: vanilla:governor, vanilla_index: 7,  name_key: ui.mappoint.governor, original_class: CPalace }      # [推断] 无独立类
  - { key: vanilla:inn,      vanilla_index: 8,  name_key: ui.mappoint.inn,      original_class: CInn }
  - { key: vanilla:remains,  vanilla_index: 9,  name_key: ui.mappoint.remains,  original_class: CMpRemains }
  - { key: vanilla:church,   vanilla_index: 10, name_key: ui.mappoint.church,   original_class: CMpRemains }   # 与 9 同入口
  - { key: vanilla:gate,     vanilla_index: 11, name_key: ui.mappoint.gate,     original_class: CMpRemains }   # 与 9 同入口；不是离港
