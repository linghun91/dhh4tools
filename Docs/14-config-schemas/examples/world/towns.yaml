schema: dk4.world.towns
version: 2
# 原版内容包片段。数据：Docs/_data/towns_world0.json。所属：Docs/01-world/02-towns.md
# 只放 world 字段（含发展度初值 develop_initial）。特产品槽 → economy/special_products.yaml；份额槽 +0x4C → factions/town_shares_initial.yaml；
# 流行 +0x7E → factions/fashion_initial.yaml；地图点 +0x48 → town/town_map_points.yaml（D10 按所有权拆）。
# 坐标与航行坐标同一空间 [推断]；/16 → World.dat 2500×1250 chip 下标（01-world/01）。

towns:
  - key: vanilla:london
    vanilla_index: 0
    name_key: town.london.name
    coords: { space: original, x1: 20080, y1: 4272, x2: 20136, y2: 4280 }
    is_capital: true
    culture: vanilla:england       # 原 +0x25（JSON culture_id 0）→ factions/cultures.yaml
    remains: vanilla:stonehenge    # 原 +0x26（JSON remains_id 0）
    known_at_start: true           # +0x46 bit0
    develop_initial: { commerce: 4600, military: 4400 }   # +0x52 2×u16；发展度归 world Towns（06）
    unknown:
      byte_0x27: 0

  - key: vanilla:bristol
    vanilla_index: 1
    name_key: town.bristol.name
    coords: { space: original, x1: 19632, y1: 4304, x2: 19624, y2: 4312 }
    is_capital: false
    culture: vanilla:england
    remains: null                  # 原版 26 = 无，只在 legacy_codec
    known_at_start: true
    develop_initial: { commerce: 1500, military: 1800 }
    unknown:
      byte_0x27: 0
