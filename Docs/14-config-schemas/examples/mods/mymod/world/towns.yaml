schema: dk4.world.towns
version: 2
towns:
  # 新港：无 vanilla_index，不写任何整数
  - key: mymod:new_port
    name_key: mymod:town.new_port.name
    coords: { space: original, x1: 20200, y1: 4300, x2: 20210, y2: 4308 }
    is_capital: false
    culture: vanilla:england
    remains: null
  # 删除：引用 bristol 的特产品、航线、委托必须同一模组里先改掉，否则校验失败
  - key: vanilla:bristol
    $op: delete
    orphan_policy: { replace_with: vanilla:london }   # 旧存档里停在布里斯托尔的舰队落到伦敦（D1）
