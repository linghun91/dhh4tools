schema: dk4.engine.tick
version: 3
# 所属：Docs/00-overview/05-config-architecture.md「tick 顺序」；D4。phase / 步骤 key 见 10-key-glossary §11。
# 每日拍数不在这里：$caps.calendar_ticks_per_day（原版 48 = 0x30）。
# schedule 只取：tick | day_start | month_start | month_end | year_start；修饰：every_n_days、when: at_sea、per: town | phase
# 原版世界 tick fn_14000277f（body 0x1402aad80）顺序照抄；改顺序会改数值，本文件属规则包版本。
phases:
  - { id: climate, system: world.climate, schedule: [day_start] }          # 1 CWorld::vfunc_04（风计时到期才重掷风力档）
  - { id: npc_fleets, system: fleets, schedule: [tick] }                   # 2 CFleetElement
  - id: daily                                                              # 2 内：CFleetElement 日首经 fn_14000641f 对玩家舰队调 fn_140005a15（旧称 DailyTick，是阶段不是事件）
    schedule: [day_start]
    # 不挂 when: at_sea（词表 §14-18）：在港分支只走 fleets.fatigue 的恢复枝 -(rand(5)+2)，其余步骤按 Fleets.location 跳过；旅馆每夜推进日首同样触发
    steps:                                                                 # 海上分支：原版 fn_140005a15 内部顺序（06-ocean/01 §4.4）
      - ocean.supply_drain           # F-ADJ-03 补给日耗（读当前结局态）；在港不耗
      - fleets.fatigue               # 舰队疲劳日增量（状态归 fleets）；在港枝恢复
      - ocean.happening_upkeep       # happening 态续期（0x1400fae0f–0x1400fb1a6，未逐条还原）
      - characters.vitals            # 人物 HP / 身体 / 精神（用掷骰前的状态）
      - ocean.happening_roll         # 20 槽 CDF → 结局态
      - characters.mental_transition # 事件引起的精神转移（人物拥有）
      - ocean.happening_persist      # 持续态
  - id: duty_exp                     # 在岗经验：每 3 天、仅在海上（fn_140009b24 packed % 0x90）
    system: progression.duty_exp
    schedule: [day_start]
    every_n_days: 3
    when: at_sea
  - id: items                                                              # 3 CItemElement
    system: items
    schedule: [month_end]
    steps: [economy.treasure_rent]   # 出租费：CItemElement::vfunc_04，排在 towns 独占上缴之前（词表 §14-17）
  - { id: persons, system: characters, schedule: [day_start] }             # 4 CPersonElement
  - id: towns                                                              # 5 CTownElement
    schedule: [month_start, month_end]
    steps:
      month_start:                   # 原版：景气切换 → 全局市价漂移 → 逐港「投资转化 → 补货」
        - economy.town_state_update
        - economy.price_drift
        - { per: town, steps: [economy.investment_convert, economy.restock] }
      month_end:                     # 月末最后一拍（出租费已在 items 阶段收过）
        - economy.exclusive_tribute
  - id: forces                                                             # 6 CForceElement（AI、宗主 / 附庸税；factions 执行并发 SuzerainTributePaid，金额式在 formulas/tribute.yaml）
    system: factions
    schedule: [month_start]
    steps: [factions.suzerain_tribute]
  - { id: schemes, system: town.schemes, schedule: [day_start] }           # 7
  - { id: requests, system: town.requests, schedule: [month_start] }       # 8
  - { id: star_goods, system: economy.star_goods, schedule: [year_start] } # 9 年初星品（晚于当月补货）
  - { id: gold_road_bonus, system: ocean.gold_road, schedule: [month_start] }  # 10 fn_1400108fc
  - { id: player_fleet, system: ocean, schedule: [tick] }                  # fn_140011414
# 模组插入：
# phases: { $append: [{ id: mymod_tax, system: mymod.tax, schedule: [month_start], insert_after: forces }] }
