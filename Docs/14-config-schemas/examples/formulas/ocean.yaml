schema: dk4.formulas.ocean
version: 3
# 所属：Docs/06-ocean/01-sailing.md；F-OCN-*

wind_level_from_rng:                  # F-OCN-02：只在世界风计时到期时重掷（CWorld::vfunc_04）
  impl: vanilla.wind_level
  rng_stream: climate
  params:
    wind_velocity_bias: 3
  refs:
    calm_outcome: vanilla:calm        # happening 结局态 24（0x18）「无风」（名表 .data 0x140686550）→ 风速 0；不是气候 id
  tables:
    cdf: [30, 50, 70, 80, 87, 96]
    high_band_rand: 20
    high_band_cuts: [4, 7, 10, 13, 16, 18]

sailing_speed:                        # F-OCN-01：四处 idiv 全钉
  impl: vanilla.sailing_speed
  int_mode: vanilla_i32
  params:
    square_cone_low: 42               # 0x2A（比较 sail_angle）
    square_cone_high: 214             # 0xD6
    fore_fixed_cos: 128               # 横帆枝里纵帆按固定 128 计
    blanket_angle: 32
    sail_shift: 17
    min_speed_floor: 96               # 0x60
    speed_bias: 192                   # 0xC0
    rower_gate_fatigue: 50            # 疲劳 < 50 才划桨
    crew_den_factor: 2                # 第四个 idiv：/(2 * crew_needed)
  refs:
    rower_cabin_role: rower_room
  modifiers:
    display: fleet.speed              # 船首像 ×11/10（order 10）、×4/5（order 20）
    move: fleet.speed_move            # 海战态 ×1/3（order 900，写速度条之后）

rowing_bonus:                         # F-OCN-03：10 * cabin_count(rower_room) / crew_per_mast_by_grade[grade]
  impl: expr
  params: { rowing_mul: 10 }
  inputs: [rower_rooms, grade_div]    # grade_div 来自 ships/rig.yaml crew_per_mast_by_grade
  expr: "rowing_mul * rower_rooms / grade_div"

ticks_per_frame:                      # 每帧推进拍数
  impl: vanilla.ticks_per_frame
  params:
    normal: 1
    fast: 2                           # [推断]：fn_140012625 为真时
