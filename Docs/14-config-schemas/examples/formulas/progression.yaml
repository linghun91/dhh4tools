schema: dk4.formulas.progression
version: 1
# F-PROG-*  所属：Docs/13-algorithms/01-formulas.md
# 魔数只出现在本文件。系统代码读参数名。

level_from_exp:
  exp_divisor: 30
  overflow: saturate

exp_from_level:
  exp_divisor: 30

track_level:
  exp_divisor: 30
  # level_per_track 来自 caps.yaml，不在此重复

total_level:
  track_count: 2

skill_value:
  skill_cap: 200          # 也可只读 caps.skill_cap；两处必须一致，校验器检查
  level_bias: 100
  skill_divisor: 150
  # stat_a / stat_b 配对在 characters/skills.yaml

clamp_settled:
  ability_settled_cap: 500
