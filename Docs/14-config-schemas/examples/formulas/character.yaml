schema: dk4.formulas.character
version: 2
# F-PROG-05 / F-PROG-06 / F-PROG-09。所属：Docs/03-characters/03-abilities-skills-jobs.md
# 原版 fn_14000e1ce(person, eSkill) 的阶段序就是修正器堆叠：
#   base = skill_value（F-PROG-05） → add = 装备（items/effects.yaml） → mul = 身体状态（characters/vitals.yaml） → clamp = skill_value_cap
# 系数表不在这里：身体 / 精神乘子是 characters/vitals.yaml 各状态行的修正器贡献。

skill_value:                          # F-PROG-05；修正器 key skill.<skill_key> 的 base（原 progression.yaml）
  impl: expr
  int_mode: vanilla_i32
  params: { level_bias: 100, skill_divisor: 150 }
  inputs: [stat_a, stat_b, total_level]     # stat_* 已过 vitals 精神修正（ability.<key>）；total_level 来自 Progression.total_level
  expr: "clamp((stat_a + stat_b) * (min(total_level, $caps.skill_level_cap) + level_bias) / skill_divisor, 0, $caps.skill_value_cap)"
  golden: [{stat_a: 59, stat_b: 58, total_level: 2, out: 79}]
  # stat_a / stat_b 配对在 characters/skills.yaml

ability:                              # F-PROG-09：业务系统读的「技能值」= Modifiers.eval("skill.<key>", {person})
  impl: vanilla.ability
  int_mode: vanilla_i32               # mul 阶段先乘后除、向零截断（19/20、1/2、1/10、3/5）
  modifiers: skill.<skill_key>        # 每条技能一个 key
  params:
    output_clamp: $caps.skill_value_cap   # F-PROG-06；不夹六维
    # 装备槽数不在此：引用 items/effects.yaml slot_groups 槽总数（原版 5，fn_14000e0b6；09-items/02 §6）
    cabin_lookup_scope: player_force  # ctx.cabin（舱室种类 key）只对玩家势力查；none | player_force | all
  golden:
    - { base: 100, equip: 0, physical: vanilla:heavy_wound, out: 50 }
    - { base: 499, equip: 10, physical: vanilla:healthy, out: 500 }
