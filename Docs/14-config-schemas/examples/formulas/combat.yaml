schema: dk4.formulas.combat
version: 3
# 所属：Docs/07-combat/01-naval-battle.md、02-boarding.md；F-CBT-*（13-algorithms/01-formulas.md）

can_fire:                             # F-CBT-02
  impl: vanilla.can_fire
  params: { min_cannon_range2: 900, coord_shift: 7 }   # d2 = (dx>>7)^2 + (dy>>7)^2，无符号比较
  refs: { post: vanilla:gunner, skill: vanilla:gunnery }
  modifiers: combat.gun_power         # 龙像 +2 由 ships/figureheads.yaml 贡献

fleet_defeated:                       # F-CBT-03（仅无画面结算）
  impl: expr
  int_mode: vanilla_i32               # 有符号 <= 30
  params: { defeat_hull_le: 30, defeat_crew_le: 30 }
  inputs: [flagship_hull, flagship_crew]
  expr: "flagship_hull <= defeat_hull_le || flagship_crew <= defeat_crew_le"

duel_crew_loss:                       # F-CBT-01：单挑败方水手损失（旧名 battle_settlement_factor）
  impl: expr
  int_mode: vanilla_i32
  params:
    ref_500: 500
    battle_scale: 500                 # idiv 0x1F4 四处
    battle_ability_clamp: $caps.battle_ability_clamp
  refs: { skill: vanilla:leadership } # 败方提督统率力（原版 eSkill 1）
  inputs: [crew, ability]
  expr: "crew * (ref_500 - clamp(ability, 0, battle_ability_clamp)) / battle_scale"

boarding_fencing:                     # F-CBT-04（不对称）
  impl: vanilla.boarding_fencing
  int_mode: vanilla_i32
  refs:
    skill: vanilla:fencing            # 原版 eSkill 5
    cabin_role: marine_room           # 玩家侧取水兵室全体乘员（舱室种类 7；岗位 8 冲锋队长）
  params:
    duel_gate: 30
    duel_roll: 10
    duel_diff_div: 100
    fencing_ref: 200
    fencing_div: 2000
    chief_best_div: 1200
    fencing_rand: 3
    melee_halve: 2
  modifiers: combat.melee_damage      # 王者像 ×6/5 只加己方，由 ships/figureheads.yaml 贡献
  rng_stream: combat

# 炮种按军事发展度上架门槛 [1, 1, 2000, 3500, 5000, 7000] 是 ships/guns.yaml 的 necessary_development 列（05-ships-fleet/08），不在公式文件重复
