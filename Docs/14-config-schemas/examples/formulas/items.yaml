schema: dk4.formulas.items
version: 2
# F-ECO-02 道具店还价 + 装备加成参数。所属：Docs/09-items/02-equipment-effects.md；总表 Docs/13-algorithms/01-formulas.md
# 旧稿在 formulas/economy.yaml（item_price_factor）/ character.yaml；公式归 items 自己。

item_bargain:                         # F-ECO-02：买入时会计长还价，原版最多 9 折
  impl: expr
  int_mode: vanilla_i32
  quirks: { unsigned_div: true }      # 乘后 div 0x64 无符号
  params:
    price_base: 100
    skill_divisor: 50                 # idiv 0x32
    price_scale: 100                  # 0x14015657f
    price_factor_floor: 0             # 重构护栏；原版靠 skill_value_cap 500 保证 factor ≥ 90
    affordability_check: before_discount   # 原版先比折前价
  refs: { skill: vanilla:accounting, post: vanilla:purser }   # 会计长不在岗（Fleets.post_holder 为 null）则不打折
  inputs: [price, ability]            # ability = Modifiers.eval("skill.accounting", {person: purser})
  expr: "price * max(price_factor_floor, price_base - ability / skill_divisor) udiv price_scale"
  golden: [{price: 1000, ability: 500, out: 900}]
  modifiers: trade.item_shop_price
  # 经验：items 发 ItemBargained，progression 按 grant_routes 给（轨 B +10）

equip_skill_bonus:                    # 装备 → skill.<key> 的 add 贡献（D2）
  impl: vanilla.equip_skill_bonus
  params:
    stage: add
    order: 100
    armament_kinds: [vanilla:weapon, vanilla:armor]
    command_check: { protagonist: true, non_player_force: true, detached_fleet_admiral: true, escort_ship_captain: true }   # fn_14000f826，四项任一放行
  refs: { armament_skill: vanilla:fencing, command_cabins: [vanilla:captain_room] }   # 原版写死 eSkill 5 / 舱室种类 5
  modifiers: skill.<skill_key>
