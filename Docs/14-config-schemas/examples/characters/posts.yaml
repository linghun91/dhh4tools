schema: dk4.characters.posts
version: 2
# 16 岗位。所属：Docs/03-characters/03（人物拥有岗位定义；舱室种类 key 由 ships/cabins.yaml 给）。key 见 10-key-glossary §3。
# room = 舱室种类 key（fn_140007e19 / fn_140012dd2 互逆）；threshold = 原版舱表 +0x12（语义 [推断]）。
# 「谁在岗」= Fleets.post_holder(fleet_id, post_key)；holder_rule 在 fleets/post_rules.yaml。原版无岗位 0x11 只在 ids/legacy_codec.yaml。
posts:
  - { key: vanilla:captain,        vanilla_index: 0,  room: vanilla:captain_room,  skill: vanilla:leadership,   threshold: 30, protagonist_only: true }
  - { key: vanilla:adjutant,       vanilla_index: 1,  room: vanilla:adjutant_room, skill: vanilla:persuasion,   threshold: 100 }
  - { key: vanilla:staff,          vanilla_index: 2,  room: vanilla:staff_room,    skill: vanilla:tactics,      threshold: 120 }
  - { key: vanilla:purser,         vanilla_index: 3,  room: vanilla:purser_room,   skill: vanilla:accounting,   threshold: 100 }
  - { key: vanilla:surveyor,       vanilla_index: 4,  room: vanilla:survey,        skill: vanilla:surveying,    threshold: 120 }
  - { key: vanilla:sail_master,    vanilla_index: 5,  room: vanilla:mast,          skill: vanilla:helmsmanship, threshold: 80 }
  - { key: vanilla:helmsman,       vanilla_index: 6,  room: vanilla:helm,          skill: vanilla:helmsmanship, threshold: 60 }
  - { key: vanilla:lookout,        vanilla_index: 7,  room: vanilla:crows_nest,    skill: vanilla:observation,  threshold: 70 }
  - { key: vanilla:boarding_chief, vanilla_index: 8,  room: vanilla:marines,       skill: vanilla:fencing,      threshold: 90, multi_holder: true }   # 接舷收该舱全部人
  - { key: vanilla:gunner,         vanilla_index: 9,  room: vanilla:gun_deck,      skill: vanilla:gunnery,      threshold: 90 }
  - { key: vanilla:missionary,     vanilla_index: 10, room: vanilla:chapel,        skill: vanilla:persuasion,   threshold: 160 }
  - { key: vanilla:surgeon,        vanilla_index: 11, room: vanilla:infirmary,     skill: vanilla:observation,  threshold: 150 }
  - { key: vanilla:cook,           vanilla_index: 12, room: vanilla:galley,        skill: vanilla:gunnery,      threshold: 70 }
  - { key: vanilla:carpenter,      vanilla_index: 13, room: vanilla:carpentry,     skill: vanilla:surveying,    threshold: 130 }
  - { key: vanilla:keeper,         vanilla_index: 14, room: vanilla:livestock,     skill: vanilla:vitality,     threshold: 130 }
  - { key: vanilla:deck_chief,     vanilla_index: 15, room: vanilla:deck,          skill: vanilla:vitality,     threshold: 30 }
defaults: { enforce_threshold: false, protagonist_only: false, multi_holder: false }   # 原版任命是否拦人 [未知]
