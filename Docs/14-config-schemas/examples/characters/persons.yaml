schema: dk4.characters.persons
version: 2
# 原版内容包片段。数据：Docs/_data/persons_world0.json / persons.tsv。World 行步长 0x38。
# 技能不存：由 formulas/character.yaml + characters/skills.yaml 派生。所属：Docs/03-characters/01-person-model.md（字段以该篇为准）

persons:
  - key: vanilla:raphael_castro
    vanilla_index: 0
    name_key: person.raphael_castro.name   # 拉斐尔·卡斯特罗
    category: protagonist      # protagonist | officer | job_npc | crew_template | event | capital_lady；替代「0–6 是主角」
    sex: male                  # W+0x26：1 = female，其它 = male
    stats:                     # W+0x20 → CPerson+0x0F
      vanilla:stamina: 59
      vanilla:agility: 60
      vanilla:charm: 70
      vanilla:intelligence: 62
      vanilla:spirit: 58
      vanilla:luck: 61
    init_exp: [100, 100]       # W+0x18 / +0x1C → CPerson+0x18 / +0x1C（两段经验）
    zodiac: vanilla:pisces             # W+0x29 = 2；成长倾向查 characters/zodiac.yaml
    init_force: vanilla:castro # W+0x2A；无所属写 null（原版 26 只在 legacy_codec）
    recruitable_roster: true   # 内容包标记，不由 id 区间推（D1）
    unknown_bytes: { w27: 4, w28: 2, w2c: 1, w30: 0 }   # 未命名字节原样保存
