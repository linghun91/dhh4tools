schema: dk4.economy.culture_prices
version: 1
# 21 文化圈 × 交易品卖价底。所属：Docs/04-economy/02-market-price.md（旧路径 factions/culture_prices.yaml 是别名）。
# 所有权（D10）：文化圈行的 key、名字、major_sea 归 factions（factions/cultures.yaml）；本表只拥有数值列，以 culture key 关联，不按下标。
# 原版包由导出脚本从 exe .rdata 0x1405b6160 按段换算生成，不手抄。
default_sell_price: from_catalog_data_price   # 缺项走交易品目录 data_price；加载期报覆盖率
coverage: warn                                # 原版包要求 105/105，模组缺项只告警
cultures:
  - culture: vanilla:england   # 原版下标 0「英吉利」
    fashion_push_up: 7         # 静态 +9 → CCulture+0x11
    fashion_push_down: 4       # 静态 +10 → CCulture+0x12
    sell_price: { vanilla:wheat: 800, vanilla:rice: 1230, vanilla:corn: 1550, vanilla:wool: 850, vanilla:coal: 1350 }   # 稀疏映射（片段）
no_culture:                    # 港口 culture = null（原版 0x16 只在 legacy_codec）
  fashion_push: 7              # fn_1400077bb 无文化圈返回 7
  sell_quote: null
