schema: dk4.ships.figureheads
version: 1
# 船首像。所属：Docs/05-ships-fleet/04-remodel-guns-supplies.md（Ships 拥有；旧路径 items/figureheads.yaml 是别名）。
# 效果 = 向修正器注册表登记带来源的贡献（D2），key 须已在 modifiers.yaml 注册；公式不比船首像 id。
# item 外键到道具（09-items 持有道具本体）：114–123、199、200。实例空值 0x0D 只在 ids/legacy_codec.yaml。
figureheads:
  - key: vanilla:eagle
    vanilla_index: 0
    item: vanilla:eagle_figurehead       # 114 大鹫像
    effects:
      - { key: fleet.speed, stage: mul, order: 10, value: { num: 11, den: 10 }, scope: fleet_any, stack: once }   # 原版 s += s/10
  - key: vanilla:piglets
    vanilla_index: 1
    item: vanilla:piglet_figurehead      # 115 小猪像
    effects:
      - { key: supply.food_div, stage: add, value: 2, scope: fleet_any, stack: once }
  - key: vanilla:white_whale
    vanilla_index: 3
    item: vanilla:white_whale_figurehead # 117 白鲸像
    effects:
      - { key: ship.durability_max, stage: add, value: 10, scope: ship }
  - key: vanilla:dolphin
    vanilla_index: 5
    item: vanilla:dolphin_figurehead     # 119 海豚像
    effects:
      - { key: fleet.search_radius_add, stage: add, value: 16, scope: fleet_any, stack: once }
  - key: vanilla:devil
    vanilla_index: 7
    item: vanilla:devil_figurehead       # 121 魔鬼像
    effects:
      - { key: fleet.speed, stage: mul, order: 20, value: { num: 4, den: 5 }, scope: fleet_any, stack: once }
      - { key: combat.hull_floor_at_zero, stage: override, value: 1, scope: ship }
  - key: vanilla:king
    vanilla_index: 8
    item: vanilla:king_figurehead        # 122 王者像
    effects:
      - { key: combat.melee_damage, stage: mul, value: { num: 6, den: 5 }, scope: fleet }   # 原版 x += x/5，只加己方
  - key: vanilla:monster_fish
    vanilla_index: 10
    item: vanilla:monster_fish_figurehead   # 199 怪鱼像
    effects:
      - { key: combat.engage_fear_crew_div, stage: override, value: 10 }   # 无画面开场：对侧每船 crew -= crew/10
  # 其余（orca 2、dragon 4、maiden 6、madonna 9、admiral 11）见所属文档全表
